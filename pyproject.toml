[project]
name = "image-generation-mcp"
version = "0.1.0"
description = "Minimal MCP server that generates images with Gemini, OpenAI, or Vercel AI Gateway."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ömer Faruk Can", email = "omer@farukcan.net" }]
keywords = ["mcp", "model-context-protocol", "image-generation", "gemini", "openai", "vercel", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "google-genai>=2.3.0",
    "openai>=3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/farukcan/image-generation-mcp"
Repository = "https://github.com/farukcan/image-generation-mcp"
Issues = "https://github.com/farukcan/image-generation-mcp/issues"

[project.scripts]
image-generation-mcp = "image_generation_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_generation_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "media"]
mypy_path = "media"

[tool.pytest.ini_options]
addopts = "-m 'not smoke'"
markers = ["smoke: hits real provider APIs and costs money"]
asyncio_mode = "auto"
testpaths = ["tests"]
